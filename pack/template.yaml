# Overlay applied on every import/update. Paths and secret are filled by merge_config.py.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
  unified-delay: true
  tcp-concurrent: true
  external-controller: 127.0.0.1:19090
external-controller-cors:
  allow-origins:
    - 'http://127.0.0.1:9090'
    - 'http://localhost:9090'
  allow-private-network: true
external-ui: UI_DIR
external-ui-name: ui
secret: SECRET
dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 8.8.8.8
