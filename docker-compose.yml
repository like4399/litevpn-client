services:
  litevpn:
    build:
      context: .
      provenance: false
      sbom: false
    image: litevpn-client-linux:latest
    container_name: litevpn-client-linux
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:7890:7890"
    volumes:
      - ./data/config:/config
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /usr/share
      LITEVPN_BIN_DIR: /usr/local/bin
      LITEVPN_LISTEN_HOST: "0.0.0.0"
      LITEVPN_BIND_ADDRESS: "0.0.0.0"
      SAFE_PATHS: /usr/share/litevpn:/config
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://127.0.0.1:9090/ui/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
